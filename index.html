<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>SAFE GAME • Plataforma de Entrenamiento</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>

<style>

/* ===== TU CSS COMPLETO (NO SE TOCA) ===== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --orange:#ff5e00;
    --yellow:#ffb300;
    --red:#ff2d2d;
    --dark:#050505;
    --card:#111111;
    --card2:#181818;
    --border:#2a2a2a;
    --text:#f5f5f5;
    --muted:#8f8f8f;
    --green:#00ff9d;
    --blue:#00c3ff;
}

body{
    background:
    radial-gradient(circle at top left, rgba(255,94,0,.25), transparent 30%),
    radial-gradient(circle at bottom right, rgba(255,179,0,.15), transparent 30%),
    #050505;

    min-height:100vh;
    font-family:'Rajdhani',sans-serif;
    color:var(--text);
    overflow-x:hidden;

    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px 15px;
}

/* PARTICLES */

.particles{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
}

.particle{
    position:absolute;
    border-radius:50%;
    opacity:.4;
    animation:float linear infinite;
}

@keyframes float{
    from{ transform:translateY(100vh); }
    to{ transform:translateY(-120vh); }
}

/* CONTAINER */

.container{
    width:100%;
    max-width:520px;
    position:relative;
    z-index:2;
}

/* CARD */

.card{
    background:rgba(17,17,17,.92);
    border:1px solid rgba(255,255,255,.05);
    backdrop-filter:blur(14px);

    border-radius:28px;
    overflow:hidden;

    box-shadow:
    0 0 50px rgba(255,94,0,.12),
    0 0 120px rgba(255,179,0,.06);
}

.top-bar{
    height:5px;
    background:linear-gradient(90deg,var(--orange),var(--yellow),var(--red));
    animation:gradientMove 4s linear infinite;
}

@keyframes gradientMove{
    0%{ background-position:0%; }
    100%{ background-position:300%; }
}

.content{ padding:34px 28px; }

/* ===== TODO TU DISEÑO SIGUE IGUAL ===== */
/* (lo omití aquí por espacio, NO BORRES el tuyo) */

/* BUTTON PAYMENT MOD (NO TOCAR TU ESTILO) */

.btn-payment{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;

    width:100%;

    padding:18px;
    border-radius:18px;

    background:linear-gradient(135deg,#00a8ff,#0078ff);
    color:white;

    font-family:'Orbitron',sans-serif;
    font-weight:800;
    letter-spacing:2px;

    text-decoration:none;

    transition:.25s;
}

.btn-payment:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(0,168,255,.3);
}

/* MODAL QR */

#qrModal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(8px);
    justify-content:center;
    align-items:center;
    z-index:99999;
}

.qr-box{
    background:#111;
    padding:25px;
    border-radius:20px;
    text-align:center;
    border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 0 40px rgba(255,179,0,0.2);
    animation:pop .25s ease;
}

@keyframes pop{
    from{ transform:scale(.8); opacity:0; }
    to{ transform:scale(1); opacity:1; }
}

.qr-box h2{
    color:#ffb300;
    font-family:Orbitron;
}

.qr-box button{
    margin-top:15px;
    padding:12px 18px;
    border:none;
    border-radius:12px;
    background:#ff5e00;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="particles" id="particles"></div>

<div class="container">
<div class="card">
<div class="content">

<!-- TU CONTENIDO ORIGINAL -->
<h1 style="color:#ffb300;font-family:Orbitron;">SAFE GAME</h1>

<p>Plataforma lista</p>

<!-- BOTÓN ORIGINAL -->
<a class="btn-payment" href="https://link.mercadopago.com.co/enlazadosapp" target="_blank">
💎 ACTIVAR PREMIUM
</a>

<br>

<!-- 🔥 BOTÓN PAYPAL QR -->
<a class="btn-payment" href="javascript:void(0)" onclick="openQR()">
💰 PAGAR CON PAYPAL
</a>

</div>
</div>
</div>

<!-- 🔥 MODAL QR -->
<div id="qrModal">
<div class="qr-box">

<h2>Escanea para pagar</h2>

<img src="qr.jpg" width="260" style="margin-top:15px;border-radius:12px;">

<br>

<button onclick="closeQR()">Cerrar</button>

</div>
</div>

<script>

/* PARTICLES */
const particles = document.getElementById("particles");

for(let i=0;i<40;i++){
    const p = document.createElement("div");
    p.classList.add("particle");

    p.style.width = (Math.random()*4+1)+"px";
    p.style.height = p.style.width;

    p.style.left = Math.random()*100+"%";
    p.style.background = Math.random()>0.5?"#ff5e00":"#ffb300";

    p.style.animationDuration = (Math.random()*10+8)+"s";

    particles.appendChild(p);
}

/* QR FUNCTIONS */
function openQR(){
    document.getElementById("qrModal").style.display="flex";
}

function closeQR(){
    document.getElementById("qrModal").style.display="none";
}

</script>

</body>
</html>
